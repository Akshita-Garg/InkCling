      <circle cx="720" cy="250" r="70" fill="#d4665a" opacity="0.5"/>
    </g>
    <g filter="url(#wc2)" fill="#6f9ad4">
      <circle cx="770" cy="660" r="22" opacity="0.7"/><circle cx="820" cy="610" r="10" opacity="0.7"/>
      <circle cx="210" cy="470" r="16" opacity="0.6"/><circle cx="245" cy="420" r="8" opacity="0.6"/>
