    <feDisplacementMap in="SourceGraphic" in2="warp" scale="40" xChannelSelector="R" yChannelSelector="G" result="shape" />
    <feGaussianBlur in="shape" stdDeviation="3" result="soft" />
    <feGaussianBlur in="shape" stdDeviation="14" result="wide" />
    <feComposite in="soft" in2="wide" operator="arithmetic" k2="1" k3="-0.75" result="rim0" />
